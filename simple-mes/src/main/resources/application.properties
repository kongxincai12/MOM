# ===== 简易 MES 后端服务 =====
server.port=9901
spring.application.name=simple-mes-server

# ---- Oracle 数据源（请按本地/厂區实际情况修改 url / username / password）----
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orcl
spring.datasource.username=JCD_SZ
spring.datasource.password=wzw2015578

# Druid 连接池参数（initial-size=0 + async-init：即使本地 Oracle 暂时连不上也能先启动、打开登录页）
spring.datasource.druid.initial-size=0
spring.datasource.druid.min-idle=0
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=5000
spring.datasource.druid.async-init=true
spring.datasource.druid.fail-fast=false
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false

# ---- MyBatis-Plus ----
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.type-aliases-package=com.simplemes

# 关闭 JPA/SQL 自动建表（本项目使用 sql/oracle_ddl.sql 手动建表）
logging.level.com.simplemes=INFO

# ---- JWT（沿用主项目：HS256 + Base64 密钥）----
